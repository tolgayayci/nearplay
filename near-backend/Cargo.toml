[package]
name = "near-playground-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.4"
actix-cors = "0.6"
actix-web-actors = "4.3"
actix = "0.13"
tokio = { version = "1.0", features = ["full", "process"] }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
env_logger = "0.10"
log = "0.4"
anyhow = "1.0"
tempfile = "3.0"
base64 = "0.21"
reqwest = { version = "0.11", features = ["json"] }
dotenv = "0.15"
near-jsonrpc-client = "0.6"
near-jsonrpc-primitives = "0.17"
near-primitives = "0.17"
near-crypto = "0.17"
ed25519-dalek = "1.0"
bs58 = "0.5"
borsh = "0.10"
walkdir = "2.4"
zip = "0.6"
regex = "1.10"

[dev-dependencies]
actix-rt = "2.9"